name: Weekly link check

# Checks the live site only. Runs on a schedule or by hand; never on push,
# and it does not touch the GitHub Pages deployment.
on:
  schedule:
    - cron: "0 13 * * 1"  # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit links on recaptured.io
        id: audit
        continue-on-error: true
        env:
          REPORT_PATH: ${{ runner.temp }}/link-report.md
        run: python .github/scripts/link_audit.py

      - name: Open or update the failure issue
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/link-report.md
          TITLE: Weekly link check failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The weekly link check found problems on $(date -u +%Y-%m-%d). Run: $RUN_URL"
            echo
            cat "$REPORT"
          } > body.md
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
            gh issue comment "$number" --body "Still failing on $(date -u +%Y-%m-%d): $RUN_URL"
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: Fail the run when links are broken
        if: steps.audit.outcome == 'failure'
        run: exit 1
